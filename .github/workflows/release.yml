name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Make sure the tag is on main
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_REF_NAME is not on the main branch."
            exit 1
          fi

      - name: Read the version
        id: version
        run: |
          name=$(sed -n 's/^ *versionName = "\(.*\)"/\1/p' app/build.gradle.kts)
          code=$(sed -n 's/^ *versionCode = \([0-9]*\)/\1/p' app/build.gradle.kts)
          if [ "$GITHUB_REF_NAME" != "v$name" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match versionName $name."
            exit 1
          fi
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "code=$code" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Install the Android CLI
        run: |
          curl -fsSL https://dl.google.com/android/cli/latest/linux_x86_64/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install the Android SDK packages
        run: |
          sdk="$RUNNER_TEMP/android-sdk"
          mkdir -p "$sdk"
          # The runner presets ANDROID_SDK_ROOT to its own SDK, and Gradle
          # refuses to build when it disagrees with ANDROID_HOME.
          echo "ANDROID_HOME=$sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$sdk" >> "$GITHUB_ENV"
          android --version
          android --sdk="$sdk" sdk install platforms/android-37.0 build-tools/36.0.0 platform-tools

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Set up release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::The KEYSTORE_BASE64 secret is not set."
            exit 1
          fi
          mkdir -p keystore
          echo "$KEYSTORE_BASE64" | base64 --decode > keystore/release.jks
          {
            echo "storeFile=keystore/release.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > keystore.properties

      - name: Run the unit tests
        run: android --sdk="$ANDROID_HOME" build "?:app:testDebugUnitTest"

      - name: Build the release APK
        run: android --sdk="$ANDROID_HOME" build "?:app:assembleRelease"

      - name: Show the build log
        if: failure()
        run: tail -n 200 /tmp/build-log-*.log || true

      - name: Name the APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/Grid2PDF-${{ steps.version.outputs.name }}.apk"
          cd dist && sha256sum *.apk > SHA256SUMS

      - name: Publish the release
        uses: softprops/action-gh-release@v3
        with:
          name: Grid2PDF ${{ steps.version.outputs.name }}
          body_path: fastlane/metadata/android/en-US/changelogs/${{ steps.version.outputs.code }}.txt
          files: |
            dist/*.apk
            dist/SHA256SUMS

      - name: Remove signing files
        if: always()
        run: rm -f keystore.properties keystore/release.jks
